:root {
    --elfenbein: #FCF9F4;
    --text: #3E3440;
    --text-leise: #6B5F6C;
    --akzent: #9E5868;
    --akzent-dunkel: #874A59;
    --rose: #F2CDD3;
    --pfirsich: #F7D6BF;
    --salbei: #CFE3D2;
    --himmel: #CCDFF0;
    --flieder: #DED2EF;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0;
    background: var(--elfenbein);
    color: var(--text);
    font: 400 1rem/1.6 "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
}
.aquarell {
    position: fixed;
    inset: -25%;
    z-index: -1;
    filter: blur(24px);
    background:
        radial-gradient(40% 32% at 20% 22%, var(--rose), transparent 72%),
        radial-gradient(36% 30% at 82% 16%, var(--himmel), transparent 72%),
        radial-gradient(42% 34% at 80% 74%, var(--salbei), transparent 72%),
        radial-gradient(38% 32% at 18% 80%, var(--pfirsich), transparent 72%),
        radial-gradient(32% 28% at 52% 50%, var(--flieder), transparent 74%);
}
.hidden { display: none !important; }
.lade { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 1rem; }
.spinner {
    width: 2.25rem;
    height: 2.25rem;
    margin: 0 auto;
    border-radius: 50%;
    border: 2px solid var(--rose);
    border-top-color: var(--akzent);
    animation: drehen 0.9s linear infinite;
}
@keyframes drehen { to { transform: rotate(360deg); } }
main {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: max(1.5rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
}
.karte {
    width: 100%;
    max-width: 24rem;
    padding: 2.5rem 1.5rem 2rem;
    text-align: center;
    background: rgba(255, 255, 255, 0.72);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 28px;
    box-shadow: 0 20px 50px -20px rgba(62, 52, 64, 0.25);
}
h1 {
    margin: 0;
    font: 500 clamp(2.75rem, 13vw, 3.5rem)/1 "Cormorant Garamond", Georgia, serif;
    letter-spacing: 0.01em;
}
.namen {
    margin: 0.5rem 0 0;
    font: italic 500 1.65rem/1.2 "Cormorant Garamond", Georgia, serif;
    color: var(--akzent);
}
.zier { display: block; width: 7rem; height: auto; margin: 1.1rem auto 1.2rem; color: var(--akzent); opacity: 0.7; }
.hinweis { margin: 0 0 1.5rem; color: var(--text-leise); text-wrap: balance; }
.feld { position: relative; }
#staticrypt-password {
    width: 100%;
    padding: 0.9rem 3.25rem 0.9rem 1rem;
    font: inherit;
    font-size: 1.0625rem;
    color: var(--text);
    background: #fff;
    border: 1px solid #E3D6D9;
    border-radius: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}
#staticrypt-password:focus { border-color: var(--akzent); box-shadow: 0 0 0 4px rgba(158, 88, 104, 0.15); }
.auge {
    position: absolute;
    top: 50%;
    right: 0.35rem;
    transform: translateY(-50%);
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    color: var(--text-leise);
    background: none;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
}
.auge:focus-visible { outline: 2px solid var(--akzent); }
.auge svg { width: 1.35rem; height: 1.35rem; }
.fehler { margin: 0.75rem 0 0; color: #8E3B4C; font-size: 0.95rem; text-wrap: balance; }
.merken {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin: 1rem 0 1.25rem;
    color: var(--text-leise);
    font-size: 0.95rem;
    cursor: pointer;
}
.merken input { width: 1.15rem; height: 1.15rem; margin: 0; accent-color: var(--akzent); }
.knopf {
    width: 100%;
    padding: 1rem 1.25rem;
    font: 500 1.0625rem/1 "Jost", system-ui, sans-serif;
    letter-spacing: 0.03em;
    color: #fff;
    background: var(--akzent);
    border: 0;
    border-radius: 999px;
    box-shadow: 0 10px 24px -10px rgba(158, 88, 104, 0.7);
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
}
.knopf:hover { background: var(--akzent-dunkel); }
.knopf:active { transform: scale(0.98); }
.knopf:disabled { opacity: 0.75; cursor: progress; }
.knopf:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wackeln { animation: wackeln 0.4s; }
@keyframes wackeln { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) {
    .wackeln { animation: none; }
    .spinner { animation-duration: 2s; }
}
</style>
</head>
